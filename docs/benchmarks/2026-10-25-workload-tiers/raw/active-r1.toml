[server]
bind = "127.0.0.1:7423"
tcp_enabled = false
unix_socket = true

[scheduler]
timezone = "UTC"
max_concurrent_runs = 32

[logs]
backend = "file"
worker_flush_interval = 15 # minutes
db_prune_at = "03:30"
db_keep_for = 30 # days

[[worker]]
name = "sleep-1"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh sleeper /home/kit/mcb/tiers/active-r1/ev"
restart = "always"

[[worker]]
name = "sleep-2"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh sleeper /home/kit/mcb/tiers/active-r1/ev"
restart = "always"

[[worker]]
name = "crash-1"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh crashloop /home/kit/mcb/tiers/active-r1/ev"
restart = "always"
restart_delay = 2
max_restart_attempts = 1000

[[worker]]
name = "periodic-1"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh periodic /home/kit/mcb/tiers/active-r1/ev"
restart = "always"

[[worker]]
name = "periodic-2"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh periodic /home/kit/mcb/tiers/active-r1/ev"
restart = "always"

[[worker]]
name = "periodic-3"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh periodic /home/kit/mcb/tiers/active-r1/ev"
restart = "always"

[[worker]]
name = "periodic-4"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh periodic /home/kit/mcb/tiers/active-r1/ev"
restart = "always"

[[worker]]
name = "bursty-1"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh bursty /home/kit/mcb/tiers/active-r1/ev"
restart = "always"

[[worker]]
name = "bursty-2"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh bursty /home/kit/mcb/tiers/active-r1/ev"
restart = "always"

[[worker]]
name = "chatty-1"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh chatty /home/kit/mcb/tiers/active-r1/ev"
restart = "always"

[[job]]
name = "job-lines"
schedule = "@every 5s"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh job-lines /home/kit/mcb/tiers/active-r1/ev"
on_overlap = "skip"

[[job]]
name = "job-burst"
schedule = "@every 5s"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh job-burst /home/kit/mcb/tiers/active-r1/ev"
on_overlap = "skip"

[[job]]
name = "job-silent"
schedule = "@every 5s"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh job-silent /home/kit/mcb/tiers/active-r1/ev"
on_overlap = "skip"

[[job]]
name = "job-mixed"
schedule = "@every 5s"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh job-mixed /home/kit/mcb/tiers/active-r1/ev"
on_overlap = "skip"

[[job]]
name = "tick-echo"
schedule = "@every 1s"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh job-tick /home/kit/mcb/tiers/active-r1/ev"
on_overlap = "skip"

[[job]]
name = "tick-true"
schedule = "@every 1s"
command = "exec /usr/bin/taskset -c 2-3 /bin/true"
