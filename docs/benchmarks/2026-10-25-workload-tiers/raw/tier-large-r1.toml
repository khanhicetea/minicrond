[server]
bind = "127.0.0.1:7423"
tcp_enabled = false
unix_socket = true

[scheduler]
timezone = "UTC"
max_concurrent_runs = 256

[logs]
backend = "file"
worker_flush_interval = 15 # minutes
db_prune_at = "03:30"
db_keep_for = 30 # days

[[worker]]
name = "sleep-1"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh sleeper /home/kit/mcb/tiers/tier-large-r1/ev"
restart = "always"

