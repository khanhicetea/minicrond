[server]
bind = "127.0.0.1:7423"
tcp_enabled = false
unix_socket = true

[scheduler]
timezone = "UTC"
max_concurrent_runs = 32

[logs]
backend = "file"
worker_flush_interval = 15 # minutes
db_prune_at = "03:30"
db_keep_for = 30 # days

[[worker]]
name = "w-1"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh periodic /home/kit/mcb/tiers/tier-tiny-r1/ev"
restart = "always"

[[job]]
name = "t-lines"
schedule = "@every 1m"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh job-lines /home/kit/mcb/tiers/tier-tiny-r1/ev"
on_overlap = "skip"

[[job]]
name = "t-burst"
schedule = "@every 1m"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh job-burst /home/kit/mcb/tiers/tier-tiny-r1/ev"
on_overlap = "skip"

[[job]]
name = "t-tick"
schedule = "@every 1m"
command = "exec /usr/bin/taskset -c 2-3 /bin/sh /home/kit/code/minicrond/scripts/bench-5a/wl.sh job-tick /home/kit/mcb/tiers/tier-tiny-r1/ev"
on_overlap = "skip"
