name: release

on:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Use the patched Go toolchain required by the module.
          go-version: "1.27.4"
          cache: true
      - name: Test and vet
        run: |
          go test -count=1 ./...
          go vet ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check UI gateway and security contracts
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
      - name: Check contracts and shipping build
        run: |
          make contracts
          CGO_ENABLED=0 go build ./cmd/minicrond
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  prepare-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          else
            # Deleting a tag demotes its release to a draft; re-publish it.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

  upload-web:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - name: Package and upload vendored UI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          ASSET="minicrond-web-${TAG}.tar.gz"
          mkdir -p dist
          LC_ALL=C tar --sort=name --format=ustar --mtime=@0 \
            --owner=0 --group=0 --numeric-owner \
            -C internal/api/assets -cf - . | gzip -n > "dist/${ASSET}"
          (cd dist && sha256sum "$ASSET" > "${ASSET}.sha256")
          gh release upload "$TAG" "dist/${ASSET}" "dist/${ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build-and-upload:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          # Use the patched Go toolchain required by the module.
          go-version: "1.27.4"
          cache: true
      - name: Build Linux binary
        env:
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse --short=12 HEAD)"
          ASSET="minicrond-linux-${GOARCH}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o "dist/${ASSET}" \
            ./cmd/minicrond
          (cd dist && sha256sum "$ASSET" > "${ASSET}.sha256")
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/minicrond-linux-${{ matrix.goarch }}
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ASSET="dist/minicrond-linux-${GOARCH}"
          gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
