name: release

on:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          # Keep CI's compiler ahead of the module's Go language version.
          go-version: "1.27.0"
          cache: true
      - name: Test and vet
        run: |
          go test -count=1 ./...
          go vet ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Check contracts and shipping build
        run: |
          make contracts
          CGO_ENABLED=0 go build ./cmd/minicrond
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  prepare-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          fi

  build-and-upload:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          # Keep CI's compiler ahead of the module's Go language version.
          go-version: "1.27.0"
          cache: true
      - name: Build Linux binary
        env:
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse --short=12 HEAD)"
          ASSET="minicrond-linux-${GOARCH}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o "dist/${ASSET}" \
            ./cmd/minicrond
          (cd dist && sha256sum "$ASSET" > "${ASSET}.sha256")
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/minicrond-linux-${{ matrix.goarch }}
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ASSET="dist/minicrond-linux-${GOARCH}"
          gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
