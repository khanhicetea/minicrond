[server]
bind = "127.0.0.1:7423"
unix_socket = true

[include]
paths = ["jobs/*.toml"]

[scheduler]
timezone = "UTC"
max_concurrent_runs = 32

[logs]
backend = "file"
# Long-running (worker) logs are sealed from the file buffer into the SQLite
# log archive (data-dir/minicron-logs.db) on this interval.
worker_flush_interval = "15m"
# Daily prune of the log archive at this local time (scheduler timezone).
db_prune_at = "03:30"
# Archived logs older than this are deleted by the daily prune.
db_keep_for = "720h"

[defaults]
shell = "/bin/sh"
env_base = "clean"
grace = "10s"
