# Heartbeat job: three timestamped lines every 2 minutes; verify with:
#   ./mc run heartbeat --wait && ./mc logs <run_id>
[[job]]
name = "heartbeat"
schedule = "@every 2m"
env_file = "@EXAMPLE_DIR@/env.local"
command = 'exec "$EXAMPLE_DIR/scripts/heartbeat.sh" 3'
catch_up = "none"
on_overlap = "skip"
