# Hello job: runs every minute. Demonstrates @every schedules, injected
# MINICRON_* metadata, and tagged stdout. env_file is provided by start.sh
# (env.local, written by start.sh) defines EXAMPLE_DIR so the command can
# reference the checked-in scripts without a hardcoded path. start.sh
# substitutes the @EXAMPLE_DIR@ placeholder with the sandbox location before
# importing, because env_file must be an absolute path.
[[job]]
name = "hello"
schedule = "@every 1m"
env_file = "@EXAMPLE_DIR@/env.local"
command = 'exec "$EXAMPLE_DIR/scripts/hello.sh" "from config"'
catch_up = "none"
on_overlap = "skip"
labels = { tier = "example" }
alerts = ["ops"]
