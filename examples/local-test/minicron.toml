# Daemon settings for the local-test sandbox. Loaded by start.sh via
# MINICRON_CONFIG / `daemon --config`. start.sh explicitly imports jobs/*.toml
# into the SQLite definition registry after the daemon is ready.

[server]
bind = "0.0.0.0:7423"
unix_socket = true
# 0.0.0.0 is non-loopback; the daemon refuses to start without this opt-in.
# Expose only on a trusted network (e.g. a tailnet) or put TLS in front.
allow_insecure_remote = true

[scheduler]
timezone = "UTC"
max_concurrent_runs = 8

[storage]
keep_runs_default = 100
keep_for_default = 1

[logs]
worker_flush_interval = 15      # worker log checkpoint cadence, minutes
db_keep_for = 30                # archive retention, days
db_prune_at = "03:30"           # daily prune time

[defaults]
# Applied when jobs are imported or saved; explicit job settings win.
# The slow job overrides both timeout and grace; workers are unaffected.
timeout = 20                     # maximum job runtime, seconds
grace = 5                       # wait after stop signal before SIGKILL, seconds
retry_delay = 10                # delay between retries, seconds

# Telegram alert demo (opt-in): uncomment, set MINICROND_TELEGRAM_TOKEN in
# .env, and restart. The hello job opts in via alerts = ["ops"]; while the
# channel is disabled its failed runs only log an "unavailable" error.
# The daemon refuses to start while the token reference cannot be resolved.
[[alert_channel]]
name = "ops"
type = "telegram"
bot_token = "env:MINICROND_TELEGRAM_TOKEN" # or file:/absolute/path
chat_id = "-329047830"
disable_notification = false
