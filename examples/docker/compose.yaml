# docker compose -f examples/docker/compose.yaml up -d --build
services:
  minicrond:
    build:
      context: ../..
    restart: unless-stopped
    # The image's config caps each run's grace at shutdown to 5 s
    # (scheduler.shutdown_grace), which fits Docker's default 10 s stop
    # timeout. Raise both together if your programs need longer to stop.
    stop_grace_period: 15s
    volumes:
      - minicron-data:/var/lib/minicron
      - ./minicron.toml:/etc/minicron/minicron.toml:ro
volumes:
  minicron-data:
